
name: Build YT Auto Deco

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Android
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload GEODE
        uses: actions/upload-artifact@v4
        with:
          name: YT-Auto-Deco-Android
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
